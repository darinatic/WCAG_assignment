response_preview: '{"answer": "**What''s wrong**\n\nThis link contains only a search
  icon (a `<span>` with `aria-hidden=\"true\"`), so screen reader users hear it announced
  as just \"link\" with no indication of its purpose. The link has no accessible name.\n\n**Who
  it affects**\n\nScreen reader users cannot tell where this link goes. They''ll navigate
  to it and hear \"link\" with no context, making the link unusable.\n\n**The fix**\n\nAdd
  visible or hidden text that describes the link''s purpose. Since this is a search
  icon in the header, use `aria-label`:\n\n```html\n<a href=\"/search\" class=\"icon-link\"
  aria-label=\"Search\">\n  <span class=\"icon-search\" aria-hidden=\"true\"></span>\n</a>\n```\n\nAlternatively,
  if you prefer visible text (often better for all users), add a text node:\n\n```html\n<a
  href=\"/search\" class=\"icon-link\">\n  <span class=\"icon-search\" aria-hidden=\"true\"></span>\n  Search\n</a>\n```\n\nEither
  approach gives the link an accessible name that satisfies [SC 2.4.4] and ...'
