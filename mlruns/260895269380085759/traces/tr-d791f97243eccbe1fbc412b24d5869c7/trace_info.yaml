response_preview: '{"answer": "**What''s wrong**\n\nThe image has no `alt` attribute.
  [SC 1.1.1] requires all non-text content to have a text alternative that serves
  its purpose. Without it, screen reader users cannot know what the image shows.\n\n**Who
  it affects**\n\nA screen reader user navigating your news section will hear nothing
  when they reach this image—no description of the budget meeting photo, no context
  for what they''re looking at.\n\n**The fix**\n\nAdd an `alt` attribute to the image.
  The `<figcaption>` already describes the content perfectly, so use that text:\n\n```html\n<figure
  class=\"news-card\">\n  <img src=\"./budget-meeting-2026.jpg\" width=\"400\" height=\"260\"
  alt=\"Council members review the 2026 capital budget at the March 4 public hearing.\">\n  <figcaption>Council
  members review the 2026 capital budget at the March 4 public hearing.</figcaption>\n</figure>\n```\n\nThis
  gives the image an accessible name that conveys the same information sighted users
  get from the photo and ...'
