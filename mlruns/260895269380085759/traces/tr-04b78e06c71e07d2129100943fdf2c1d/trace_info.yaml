response_preview: '{"answer": "**What''s wrong**\n\nYou''ve put `aria-checked=\"false\"`
  on a `<div>` with `role=\"button\"`. The button role doesn''t support the `aria-checked`
  attribute. According to the HTML-ARIA specification, a button element can only use
  global ARIA attributes and attributes that apply to the button role — and `aria-checked`
  is not one of them.\n\n**Who it affects**\n\nA screen reader user activates this
  control and hears it announced as a button, but the checked state is ignored. If
  this button is meant to toggle something on or off, they have no way to know the
  current state.\n\n**The fix**\n\nIf this button toggles alert subscriptions on and
  off, use the `switch` role instead of `button`:\n\n```html\n<div role=\"switch\"
  tabindex=\"0\" aria-checked=\"false\" class=\"alert-toggle\">\n  Subscribe to service
  alerts\n</div>\n```\n\nThe `switch` role is designed for this exact use case — a
  control that has two states (on/off, checked/unchecked) — and it properly supports
