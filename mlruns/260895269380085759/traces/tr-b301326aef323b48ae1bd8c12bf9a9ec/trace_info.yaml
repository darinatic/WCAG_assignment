response_preview: '{"answer": "**What''s wrong**\n\nThe image has no `alt` attribute.
  [SC 1.1.1] requires non-text content to have a text alternative that serves the
  equivalent purpose. Screen readers cannot announce what this image shows.\n\n**Who
  it affects**\n\nA screen reader user hears nothing—the image is skipped entirely
  or announced as just a filename. They miss that the photo documents council members
  reviewing the 2026 capital budget at a March 4 hearing.\n\n**The fix**\n\n```html\n<figure
  class=\"news-card\">\n  <img src=\"./budget-meeting-2026.jpg\" width=\"400\" height=\"260\"
  alt=\"Council members review the 2026 capital budget at the March 4 public hearing.\">\n  <figcaption>Council
  members review the 2026 capital budget at the March 4 public hearing.</figcaption>\n</figure>\n```\n\nAdd
  an `alt` attribute to the `img` element. I inferred the text from the adjacent `figcaption`,
  which describes the image''s purpose—this is the standard pattern when a caption
  is already present on the page....'
