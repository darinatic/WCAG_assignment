response_preview: '{"answer": "**What''s wrong**\n\nThe image has no `alt` attribute.
  Screen readers cannot announce what the image shows, and users relying on text-only
  browsing have no way to understand the content.\n\n**Who it affects**\n\nA screen
  reader user hears nothing when they encounter this image—the page goes silent. Someone
  viewing the page without images (slow network, image loading disabled) sees only
  a blank space.\n\n**The fix**\n\nAdd an `alt` attribute to the `img` element. The
  `<figcaption>` already describes the image content accurately, so use that text:\n\n```html\n<figure
  class=\"news-card\">\n  <img src=\"./budget-meeting-2026.jpg\" width=\"400\" height=\"260\"
  alt=\"Council members review the 2026 capital budget at the March 4 public hearing.\">\n  <figcaption>Council
  members review the 2026 capital budget at the March 4 public hearing.</figcaption>\n</figure>\n```\n\nThe
  `alt` text mirrors the caption because they convey the same information. This satisfies
  [SC 1.1.1], which ...'
