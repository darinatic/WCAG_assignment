response_preview: '{"answer": "**What''s wrong**\n\nThis link contains only an icon
  (with `aria-hidden=\"true\"`) and no text. A screen reader announces it as just
  \"link\" with no indication that it goes to search—the purpose is completely hidden.\n\n**Who
  it affects**\n\nScreen reader users cannot tell where this link leads. They hear
  \"link\" and have to tab through to reach it, only to discover its purpose by following
  it or checking the URL bar.\n\n**The fix**\n\n```html\n<a href=\"/search\" class=\"icon-link\"
  aria-label=\"Search\">\n  <span class=\"icon-search\" aria-hidden=\"true\"></span>\n</a>\n```\n\nThe
  `aria-label=\"Search\"` gives the link an accessible name that screen readers will
  announce. Since the icon itself is marked `aria-hidden`, the label is the only content
  assistive technology sees, which is exactly what you want here.", "tool_calls":
