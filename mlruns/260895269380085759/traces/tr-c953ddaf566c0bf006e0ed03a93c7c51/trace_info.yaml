response_preview: '{"answer": "**What''s wrong**\n\nYou''ve added `aria-checked=\"false\"`
  to a `<div>` with `role=\"button\"`. The button role does not accept the `aria-checked`
  attribute according to the ARIA in HTML specification. This violates [SC 4.1.2],
  which requires that user interface components have properly defined roles and attributes.\n\n**Who
  it affects**\n\nScreen reader users may encounter confusing or incorrect announcements
  about this control, since assistive technologies receive conflicting or malformed
  information about what this element is supposed to do.\n\n**The fix**\n\nRemove
  the `aria-checked` attribute entirely. A button''s pressed or selected state should
  use `aria-pressed`, not `aria-checked`. However, if this control only toggles visibility
  of alerts (not maintaining a persistent \"selected\" state), you may not need any
  state attribute at all.\n\n```html\n<div role=\"button\" tabindex=\"0\" class=\"alert-toggle\">\n  Subscribe
