response_preview: '{"answer": "**What''s wrong**\n\nThe image has no `alt` attribute.
  [SC 1.1.1] requires all non-text content to have a text alternative that serves
  the equivalent purpose. A screen reader will currently announce only the filename
  or nothing at all.\n\n**Who it affects**\n\nA screen reader user cannot understand
  what the image shows. They hear only \"budget-meeting-2026.jpg\" (or silence), with
  no way to know it illustrates a council budget hearing.\n\n**The fix**\n\n```html\n<figure
  class=\"news-card\">\n  <img src=\"./budget-meeting-2026.jpg\" width=\"400\" height=\"260\"
  alt=\"Council members review the 2026 capital budget at the March 4 public hearing.\">\n  <figcaption>Council
  members review the 2026 capital budget at the March 4 public hearing.</figcaption>\n</figure>\n```\n\nAdd
  the `alt` attribute to the `<img>` tag with the text from the `<figcaption>`. The
  alt text conveys the same information as the image and serves the same purpose on
  the page [H37].", "tool_calls": 0}'
