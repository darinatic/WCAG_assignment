response_preview: '{"answer": "**What''s wrong**\n\nThe image has no `alt` attribute.
  [SC 1.1.1] requires all non-text content to have a text alternative that serves
  its purpose. Screen readers cannot announce what this image shows.\n\n**Who it affects**\n\nA
  screen reader user navigating your news section will hear nothing when they encounter
  this image—they won''t know it relates to the 2026 budget meeting that the caption
  describes.\n\n**The fix**\n\n```html\n<figure class=\"news-card\">\n  <img src=\"./budget-meeting-2026.jpg\"
  width=\"400\" height=\"260\" alt=\"Council members review the 2026 capital budget
  at the March 4 public hearing.\">\n  <figcaption>Council members review the 2026
  capital budget at the March 4 public hearing.</figcaption>\n</figure>\n```\n\nAdd
  the `alt` attribute to the `img` element with the text from your existing `figcaption`.
  This gives screen reader users the same information sighted users get from the caption.",
  "tool_calls": 0}'
