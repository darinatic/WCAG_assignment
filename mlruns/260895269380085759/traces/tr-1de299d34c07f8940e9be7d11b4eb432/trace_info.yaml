response_preview: '{"answer": "**What''s wrong**\n\nYou''ve added `aria-checked=\"false\"`
  to a `<div>` with `role=\"button\"`. The `button` role doesn''t support the `aria-checked`
  attribute. According to the ARIA in HTML specification, this attribute is not allowed
  on button elements.\n\n**Who it affects**\n\nScreen reader users will hear incomplete
  or incorrect state information about this control, because the attribute won''t
  be reliably announced or recognized by assistive technologies.\n\n**The fix**\n\nRemove
  `aria-checked`. If this button needs to communicate a toggled state (subscribe/unsubscribe),
  change the button''s text content to reflect the current state, or use `aria-pressed`
  instead—which is the correct ARIA attribute for toggle buttons:\n\n```html\n<div
  role=\"button\" tabindex=\"0\" aria-pressed=\"false\" class=\"alert-toggle\">\n  Subscribe
  to service alerts\n</div>\n```\n\nIf the button''s state changes with JavaScript,
