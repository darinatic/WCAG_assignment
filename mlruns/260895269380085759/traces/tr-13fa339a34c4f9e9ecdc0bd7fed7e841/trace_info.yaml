response_preview: '{"answer": "**What''s wrong**\nTwo things stand out even though
  the measured LCP (76ms) is fine: the LCP image is a 1,043,802-byte PNG loaded with
  no priority hint, and `print.css` is marked render-blocking with no `media` attribute
  — so it delays first paint for every visitor even though it only applies when printing.\n\n**Who
  it affects**\nThis test ran on localhost with near-zero network latency, so the
  76ms number won''t hold on a real connection — a 1MB image fetched over an actual
  network, without being prioritized, will push LCP well past the \"good\" 2500ms
  threshold. The unscoped `print.css` adds blocking time for everyone, on every load,
  for a stylesheet almost nobody needs at page-load time.\n\n**The fix**\n\n```html\n<link
  rel=\"stylesheet\" href=\"./print.css\" media=\"print\">\n\n<img src=\"./hero-riverfront.png\"
  class=\"hero-img\"\n     width=\"1200\" height=\"500\"\n     fetchpriority=\"high\">\n```\n\nAlso
  worth compressing/re-encoding `hero-riverfront.png` — 1MB for...'
