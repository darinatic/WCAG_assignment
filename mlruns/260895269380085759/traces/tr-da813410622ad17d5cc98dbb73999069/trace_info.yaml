response_preview: '{"answer": "**What''s wrong**\n\nThis link contains only a hidden
  icon with no accessible text. A screen reader announces it with no name at all,
  making it impossible for users to know where the link goes.\n\n**Who it affects**\n\nScreen
  reader users encounter a nameless link. They cannot determine its purpose and cannot
  navigate to the search page using this control.\n\n**The fix**\n\nAdd visible or
  accessible text that describes the link''s purpose:\n\n```html\n<a href=\"/search\"
  class=\"icon-link\" aria-label=\"Search\">\n  <span class=\"icon-search\" aria-hidden=\"true\"></span>\n</a>\n```\n\nOr
  if you prefer visible text instead of a label:\n\n```html\n<a href=\"/search\" class=\"icon-link\">\n  <span
  class=\"icon-search\" aria-hidden=\"true\"></span>\n  Search\n</a>\n```\n\nEither
  approach satisfies [SC 2.4.4] by giving the link a programmatically determinable
