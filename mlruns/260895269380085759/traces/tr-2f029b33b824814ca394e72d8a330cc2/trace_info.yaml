response_preview: '{"answer": "**What''s wrong**\n\nThe image has no `alt` attribute.
  [SC 1.1.1] requires all non-text content to have a text alternative that serves
  the equivalent purpose. Right now, a screen reader cannot announce what this image
  shows.\n\n**Who it affects**\n\nA screen reader user will hear nothing—or only the
  filename \"budget-meeting-2026.jpg\"—and won''t know the image is a photo of council
  members reviewing the budget. They lose information that sighted users see.\n\n**The
  fix**\n\nAdd an `alt` attribute to the `img` element. You have a `figcaption` right
  there that already describes the image content, so use that text as your alt:\n\n```html\n<figure
  class=\"news-card\">\n  <img src=\"./budget-meeting-2026.jpg\" width=\"400\" height=\"260\"
  alt=\"Council members review the 2026 capital budget at the March 4 public hearing.\">\n  <figcaption>Council
  members review the 2026 capital budget at the March 4 public hearing.</figcaption>\n</figure>\n```\n\nThe
  `alt` text now conveys the...'
